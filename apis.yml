aid: governata
name: Governata
description: >-
  Governata is a Saudi Arabia-based data governance and management platform that
  helps government entities and enterprises turn complex data into business value
  through comprehensive, PDPL-aligned data management. Its product suite spans Data
  Governance (business glossary, data catalog, data classification, data lineage,
  metadata store, data quality), Master Data Management (domains, golden record,
  matching and survivorship), Data Privacy (personal-data discovery and protection
  under Saudi Arabia's Personal Data Protection Law, access management, and a service
  catalog), and Governata Core, an administrative backbone covering license
  management, audit trail, and workflows. Governata packages role-based solutions
  for chief data officers, compliance officers, data protection officers, and data
  stewards, and sector solutions for government, healthcare, financial services,
  insurance, telecom, retail, energy, and large enterprises. It is backed by 500
  Global and is being profiled in the API Evangelist network. No public API,
  developer portal, or machine-readable specification was found at the time of
  enrichment; this profile captures the company's identity and web presence.
